name: CD

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Extract version from package.json
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Create and push version tag
        id: tag-version
        run: |
          VERSION_TAG="v${{ steps.package-version.outputs.version }}"
          
          # Check if tag already exists
          if git rev-parse "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Tag $VERSION_TAG already exists, skipping tag creation"
            echo "tag_created=false" >> $GITHUB_OUTPUT
          else
            git tag -a "$VERSION_TAG" -m "Release version $VERSION_TAG"
            git push origin "$VERSION_TAG"
            echo "tag_created=true" >> $GITHUB_OUTPUT
            echo "Created and pushed tag: $VERSION_TAG"
          fi
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKER_HUB_USERNAME }}/medal-challenges-rewards:v${{ steps.package-version.outputs.version }}
            ${{ vars.DOCKER_HUB_USERNAME }}/medal-challenges-rewards:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

